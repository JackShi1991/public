#模板来源：https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/lazy_group.conf
ipv6 = false
prefer-ipv6 = false
dns-server = h3://dns.alidns.com/dns-query#no-ipv6,h3://doh.pub/dns-query#no-ipv6
remote-dns-server = https://1.1.1.1/dns-query,https://dns.google/dns-query
fallback-dns-server = https://dns.quad9.net/dns-query
dns-direct-system = false
dns-direct-fallback-proxy = true
private-ip-answer = true
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,9.9.9.9:53,208.67.222.222:53
udp-policy-not-supported-behaviour = REJECT

[Proxy]
[Proxy Group]
YouTube = select,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=狮城节点
Netflix = select,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=香港节点
Disney+ = select,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=香港节点
HBOMax = select,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=香港节点
Amazon = select,DIRECT,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=香港节点

OpenAI = select,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=狮城节点
PayPal = select,DIRECT,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=美国节点
FaceBook = select,DIRECT,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=狮城节点
Spotify = select,DIRECT,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=DIRECT
游戏平台 = select,DIRECT,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=DIRECT
苹果服务 = select,DIRECT,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=DIRECT
微软服务 = select,DIRECT,PROXY,香港节点,台湾节点,日本节点,狮城节点,韩国节点,美国节点,其他节点,policy-select-name=DIRECT

香港节点 = select,policy-regex-filter=hk|HK|Hong|hong|香港|深港|沪港|京港|港
台湾节点 = select,policy-regex-filter=tw|TW|Taiwan|taiwan|台湾|台北|台中|新北|彰化
日本节点 = select,policy-regex-filter=jp|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|京日|苏日|沪日|上日|川日|深日|广日
狮城节点 = select,policy-regex-filter=sg|SG|Sing|sing|新加坡|狮城|沪新|京新|深新|杭新|广新
韩国节点 = select,policy-regex-filter=kr|KR|Korea|korea|KOR|韩国|首尔|韩|韓|春川
美国节点 = select,select=0,policy-regex-filter=us|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美
其他节点 = select,policy-regex-filter=^((?!(hk|HK|Hong|hong|香港|深港|沪港|京港|港|tw|TW|Taiwan|taiwan|台湾|台北|台中|新北|彰化|jp|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|京日|苏日|沪日|上日|川日|深日|广日|sg|SG|Sing|sing|新加坡|狮城|沪新|京新|深新|杭新|广新|kr|KR|Korea|korea|KOR|韩国|首尔|韩|韓|春川|us|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美)).)*$

